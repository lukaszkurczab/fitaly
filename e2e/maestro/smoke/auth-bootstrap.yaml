appId: com.lkurczab.fitaly
env:
  E2E_EMAIL: e2e@example.com
---
- stopApp
- openLink: __E2E_EXPO_URL__
- assertVisible:
    id: e2e-booted
- openLink: fitaly://e2e/reset?logout=1
- assertVisible:
    id: e2e-ready-login
- assertVisible:
    id: login-email-input

- runFlow: login.yaml
- assertVisible:
    id: tab-home

- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element:
      id: account-logout-row
    direction: DOWN
- tapOn:
    id: account-logout-row
- assertVisible:
    id: account-logout-confirm-button
- tapOn:
    id: account-logout-confirm-button
- assertVisible:
    id: login-email-input

- openLink: "fitaly://e2e/login?email=${E2E_EMAIL}"
- extendedWaitUntil:
    visible:
      id: e2e-ready-home
    timeout: 30000
- assertVisible:
    id: tab-home

- stopApp
- openLink: __E2E_EXPO_URL__
- assertVisible:
    id: e2e-booted
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 30000
