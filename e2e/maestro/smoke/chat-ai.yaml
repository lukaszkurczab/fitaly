appId: com.lkurczab.fitaly
---
- runFlow: login.yaml
- tapOn:
    id: tab-chat
- runFlow:
    when:
      visible:
        id: chat-legal-accept
    commands:
      - tapOn:
          id: chat-legal-accept
- tapOn:
    id: chat-input
- inputText: "Plan a balanced dinner for today"
- tapOn:
    id: chat-send-button
- assertVisible:
    id: chat-message-ai
