appId: com.lkurczab.fitaly
env:
  E2E_EMAIL: e2e@example.com
  E2E_PASSWORD: Test@1234
---
- stopApp
- openLink: __E2E_EXPO_URL__
- waitForAnimationToEnd
- assertVisible:
    id: e2e-booted
- openLink: fitaly://e2e/reset?logout=1
- assertVisible:
    id: e2e-ready-login
- assertVisible:
    id: login-email-input
- openLink: "fitaly://e2e/login?email=${E2E_EMAIL}&password=${E2E_PASSWORD}"
- extendedWaitUntil:
    visible:
      id: e2e-ready-home
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 30000
