appId: com.lkurczab.fitaly
---
- runFlow: login.yaml
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-manual
- tapOn:
    id: meal-add-option-manual
- tapOn:
    id: review-meal-save-button
- assertVisible:
    id: tab-home
- tapOn:
    id: tab-chat
- runFlow:
    when:
      visible:
        id: chat-legal-accept
    commands:
      - tapOn:
          id: chat-legal-accept
- tapOn:
    id: chat-input
- inputText: "Plan a balanced dinner for today"
- tapOn:
    id: chat-send-button
- assertVisible:
    id: chat-message-ai
- openLink: fitaly://e2e/reset?offline=1&logout=0
- assertVisible:
    id: e2e-ready-offline
- assertVisible:
    id: offline-banner
- openLink: fitaly://e2e/reset?offline=0&logout=0
- assertVisible:
    id: e2e-ready-home
