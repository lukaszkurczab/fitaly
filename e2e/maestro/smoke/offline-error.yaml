appId: com.lkurczab.fitaly
---
- runFlow: login.yaml
- openLink: fitaly://e2e/reset?offline=1&logout=0
- assertVisible:
    id: e2e-ready-offline
- assertVisible:
    id: offline-banner
- takeScreenshot: offline-banner-visible
- swipe:
    from:
      id: offline-banner
    direction: LEFT
    duration: 450
- assertNotVisible:
    id: offline-banner
- takeScreenshot: offline-banner-dismissed
- openLink: fitaly://e2e/reset?offline=0&logout=0
- assertVisible:
    id: e2e-ready-home
