appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/reset?logout=0&theme=light"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?credits=ok&chat=failure&billing=free"
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-chat-failure
- tapOn:
    id: tab-chat
- assertVisible:
    id: chat-screen
- runFlow:
    when:
      visible:
        id: chat-legal-accept
    commands:
      - tapOn:
          id: chat-legal-accept
- tapOn:
    id: chat-input
- inputText: Sprawdź proszę, czy mogę dziś jeszcze poprawić kolację.
- tapOn:
    id: chat-send-button
- assertVisible:
    id: chat-message-user
- extendedWaitUntil:
    visible:
      id: chat-error-state
    timeout: 15000
- assertVisible:
    id: chat-retry-button
- openLink: "fitaly://e2e/seed?credits=ok&chat=success&billing=free"
- assertVisible:
    id: e2e-ready-chat-success
- tapOn:
    id: chat-retry-button
- extendedWaitUntil:
    visible:
      id: chat-message-ai
    timeout: 15000
- assertNotVisible:
    id: chat-error-state
- tapOn:
    id: chat-keyboard-dismiss-zone
- assertVisible:
    id: chat-message-ai
- takeScreenshot: mj026-chat-retry-success-light
