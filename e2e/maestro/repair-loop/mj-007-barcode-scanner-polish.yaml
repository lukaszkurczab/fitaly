- assertVisible:
    id: barcode-lookup-button
- assertVisible:
    id: barcode-open-manual-button
- assertVisible:
    id: barcode-change-method-button
- takeScreenshot: mj007-barcode-detected-light
- tapOn:
    id: barcode-lookup-button
- extendedWaitUntil:
    visible:
      id: review-meal-screen
    timeout: 15000
- takeScreenshot: mj007-barcode-review-after-lookup-light

- openLink: "fitaly://e2e/reset?logout=0"
- assertVisible:
    id: e2e-ready-home
