- assertVisible:
    id: e2e-ready-barcode-known
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-barcode
- tapOn:
    id: meal-add-option-barcode
- assertVisible:
