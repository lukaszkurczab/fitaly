- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-profile
- assertVisible:
    id: account-profile-details-row
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: UP
    duration: 600
- scrollUntilVisible:
    element:
      id: account-app-settings-row
    direction: DOWN
- tapOn:
    id: account-app-settings-row
- assertVisible:
    id: app-settings-screen
- tapOn:
    id: app-settings-dark-mode-toggle
- waitForAnimationToEnd
- tapOn:
    id: back-title-header-back
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-barcode
- tapOn:
    id: meal-add-option-barcode
- assertVisible:
    id: barcode-scan-screen
- assertVisible:
    id: barcode-live-status
- assertVisible:
    id: barcode-open-manual-button
- assertVisible:
    id: barcode-change-method-button
- takeScreenshot: mj007-barcode-ready-dark
- tapOn:
    id: barcode-open-manual-button
- assertVisible:
