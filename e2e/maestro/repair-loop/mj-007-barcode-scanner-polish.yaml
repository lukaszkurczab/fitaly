appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&barcode=unknown"
- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- assertVisible:
    id: e2e-ready-barcode-unknown
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-barcode
- tapOn:
    id: meal-add-option-barcode
- assertVisible:
    id: barcode-scan-screen
- assertVisible:
    id: barcode-e2e-preview
- assertVisible:
    id: barcode-live-status
- assertVisible:
    id: barcode-open-manual-button
- assertVisible:
    id: barcode-change-method-button
- takeScreenshot: mj007-barcode-ready-light
- tapOn:
    id: barcode-open-manual-button
- assertVisible:
    id: barcode-manual-sheet
- takeScreenshot: mj007-barcode-manual-fallback-light
- tapOn:
    id: barcode-manual-cancel-button
- assertVisible:
    id: barcode-scan-screen
- tapOn:
    id: barcode-close
- assertVisible:
    id: tab-profile
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen

- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&barcode=known"
- assertVisible:
