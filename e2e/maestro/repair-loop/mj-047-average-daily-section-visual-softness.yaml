appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml

- openLink: "fitaly://e2e/reset?logout=0&theme=light"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=user-with-today-meal&credits=ok"
- assertVisible:
    id: e2e-ready-fixture-user-with-today-meal
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-statistics
- assertVisible:
    id: statistics-screen
- assertVisible:
    id: statistics-range-switcher
- extendedWaitUntil:
    visible:
      id: statistics-trend-card
    timeout: 10000
- assertVisible:
    id: statistics-summary-card
- assertVisible:
    id: statistics-summary-kcal
- assertVisible:
    id: statistics-summary-progress-track
- takeScreenshot: mj047-statistics-summary-light

- openLink: "fitaly://e2e/reset?logout=0&theme=dark"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=user-with-today-meal&credits=ok"
- assertVisible:
    id: e2e-ready-fixture-user-with-today-meal
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-statistics
- assertVisible:
    id: statistics-screen
- assertVisible:
    id: statistics-range-switcher
- extendedWaitUntil:
    visible:
      id: statistics-trend-card
    timeout: 10000
- assertVisible:
    id: statistics-summary-card
- assertVisible:
    id: statistics-summary-kcal
- assertVisible:
    id: statistics-summary-progress-track
- takeScreenshot: mj047-statistics-summary-dark
