appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml

- openLink: "fitaly://e2e/reset?logout=0"
- assertVisible:
    id: e2e-ready-home
- openLink: fitaly://e2e/seed?fixture=user-with-draft
- assertVisible:
    id: e2e-ready-fixture-user-with-draft
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-manual
- tapOn:
    id: meal-add-option-manual
- assertVisible:
    id: resume-draft-sheet
- tapOn:
    id: resume-draft-resume-button
- assertVisible:
    id: review-meal-screen
- assertVisible:
    id: review-meal-no-photo-summary
- takeScreenshot: mj012-review-no-photo-unchecked-light
- tapOn:
    id: review-meal-save-to-my-meals-checkbox
- takeScreenshot: mj012-review-no-photo-checked-light

- openLink: "fitaly://e2e/reset?logout=0"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&credits=ok&ai=photoSlow"
- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-ai-photoSlow
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-photo
- tapOn:
    id: meal-add-option-photo
- assertVisible:
    id: add-meal-photo-screen
- tapOn:
    id: add-meal-photo-capture-button
- assertVisible:
    id: add-meal-photo-preparing-screen
- extendedWaitUntil:
    visible:
      id: review-meal-screen
    timeout: 15000
- assertVisible:
    id: review-meal-photo
- takeScreenshot: mj012-review-photo-light

- openLink: "fitaly://e2e/reset?logout=0"
- assertVisible:
    id: e2e-ready-home
- tapOn:
    id: tab-profile
- assertVisible:
    id: account-identity-card
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: UP
    duration: 600
- scrollUntilVisible:
    element:
      id: account-app-settings-row
    direction: DOWN
- tapOn:
    id: account-app-settings-row
- assertVisible:
    id: app-settings-screen
- tapOn:
    id: app-settings-dark-mode-toggle
- waitForAnimationToEnd
- tapOn:
    id: back-title-header-back
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen

- openLink: fitaly://e2e/seed?fixture=user-with-draft
- assertVisible:
    id: e2e-ready-fixture-user-with-draft
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-manual
- tapOn:
    id: meal-add-option-manual
- assertVisible:
    id: resume-draft-sheet
- tapOn:
    id: resume-draft-resume-button
- assertVisible:
    id: review-meal-screen
- assertVisible:
    id: review-meal-no-photo-summary
- takeScreenshot: mj012-review-no-photo-unchecked-dark
- tapOn:
    id: review-meal-save-to-my-meals-checkbox
- takeScreenshot: mj012-review-no-photo-checked-dark
- tapOn:
    id: review-meal-close
- runFlow:
    when:
      visible: "Wyjdź"
    commands:
      - tapOn: "Wyjdź"
- runFlow:
    when:
      visible: "Leave"
    commands:
      - tapOn: "Leave"
- assertVisible:
    id: home-screen

- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&credits=ok&ai=photoSlow"
- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-ai-photoSlow
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-photo
- tapOn:
    id: meal-add-option-photo
- assertVisible:
    id: add-meal-photo-screen
- tapOn:
    id: add-meal-photo-capture-button
- assertVisible:
    id: add-meal-photo-preparing-screen
- extendedWaitUntil:
    visible:
      id: review-meal-screen
    timeout: 15000
- assertVisible:
    id: review-meal-photo
- takeScreenshot: mj012-review-photo-dark
