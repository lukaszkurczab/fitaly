appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: fitaly://e2e/seed?fixture=activated-user-empty
- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-manual
- tapOn:
    id: meal-add-option-manual
- assertVisible:
    id: meal-details-form-screen
- tapOn:
    id: meal-name-input
- eraseText
- inputText: Local Autocomplete Bowl
- hideKeyboard
- tapOn:
    id: meal-type-picker-trigger
- assertVisible:
    id: meal-type-picker-sheet
- tapOn:
    id: meal-type-picker-option-lunch
- tapOn:
    id: meal-type-picker-apply-button
- tapOn:
    id: meal-time-picker-trigger
- assertVisible:
    id: meal-time-picker-sheet
- tapOn:
    id: meal-time-picker-apply-button
- tapOn:
    id: ingredient-add-button
- extendedWaitUntil:
    visible:
      id: ingredient-editor-name-input
    timeout: 10000
- tapOn:
    id: ingredient-editor-name-input
- eraseText
- inputText: Owies
- extendedWaitUntil:
    visible:
      id: ingredient-autocomplete-results
    timeout: 10000
- assertVisible:
    id: ingredient-autocomplete-row-0
- tapOn:
    id: ingredient-autocomplete-row-0
- assertVisible: Owies lokalny
- tapOn:
    id: ingredient-editor-submit-button
- assertVisible:
    id: ingredient-row-0
