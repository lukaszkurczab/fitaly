appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/reset?logout=0&theme=light"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&credits=none&billing=free"
- assertVisible:
    id: e2e-ready-credits-none
- assertVisible:
    id: e2e-ready-billing-free
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-text
- tapOn:
    id: meal-add-option-text
- assertVisible:
    id: add-meal-text-screen
- tapOn:
    id: add-meal-text-name-input
- eraseText
- inputText: MJ033 purchase evidence bowl
- tapOn:
    point: "50%,30%"
- scrollUntilVisible:
    element:
      id: add-meal-text-upgrade-button
    direction: DOWN
- tapOn:
    id: add-meal-text-upgrade-button
- assertVisible:
    id: manage-subscription-screen
- tapOn:
    id: manage-subscription-primary-button
- assertVisible:
    id: paywall-modal
- assertVisible:
    id: paywall-close-button
- assertVisible:
    id: paywall-subscribe-button
- assertVisible:
    id: paywall-footer-disclosure
- assertVisible:
    text: "Opłata przy potwierdzeniu.*zarządzaj.*anuluj.*"
- assertVisible:
    text: "Regulamin"
- assertVisible:
    text: "Polityka prywatności"
- assertVisible:
    id: paywall-open-restore-button
- takeScreenshot: mj033-purchase-paywall-apple-review-light
