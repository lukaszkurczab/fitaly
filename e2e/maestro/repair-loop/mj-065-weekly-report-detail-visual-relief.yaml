appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml

- openLink: "fitaly://e2e/reset?logout=0&theme=light"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=user-with-today-meal&billing=premium&weeklyReport=available"
- assertVisible:
    id: e2e-ready-weeklyReport-available
- assertVisible:
    id: home-screen
- scrollUntilVisible:
    element:
      id: weekly-report-card
    direction: DOWN
- assertVisible:
    id: weekly-report-card
- tapOn:
    id: weekly-report-card
- assertVisible:
    id: weekly-report-screen
- extendedWaitUntil:
    visible:
      id: weekly-report-ready-state
    timeout: 15000
- assertVisible:
    id: weekly-report-summary-section
- assertVisible:
    id: weekly-report-signals-section
- takeScreenshot: mj065-weekly-report-ready-overview-light
- scrollUntilVisible:
    element:
      id: weekly-report-priorities-section
    direction: DOWN
- assertVisible:
    id: weekly-report-priorities-section
- takeScreenshot: mj065-weekly-report-priorities-light

- openLink: "fitaly://e2e/reset?logout=0&theme=dark"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=user-with-today-meal&billing=premium&weeklyReport=available"
- assertVisible:
    id: e2e-ready-weeklyReport-available
- assertVisible:
    id: home-screen
- scrollUntilVisible:
    element:
      id: weekly-report-card
    direction: DOWN
- assertVisible:
    id: weekly-report-card
- tapOn:
    id: weekly-report-card
- assertVisible:
    id: weekly-report-screen
- extendedWaitUntil:
    visible:
      id: weekly-report-ready-state
    timeout: 15000
- assertVisible:
    id: weekly-report-summary-section
- assertVisible:
    id: weekly-report-signals-section
- takeScreenshot: mj065-weekly-report-ready-overview-dark
- scrollUntilVisible:
    element:
      id: weekly-report-priorities-section
    direction: DOWN
- assertVisible:
    id: weekly-report-priorities-section
- takeScreenshot: mj065-weekly-report-priorities-dark
