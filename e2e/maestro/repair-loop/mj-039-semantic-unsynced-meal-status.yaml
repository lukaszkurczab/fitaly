appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/reset?logout=0&theme=light&offline=1"
- assertVisible:
    id: e2e-ready-offline
- openLink: "fitaly://e2e/seed?fixture=user-with-today-meal&credits=ok"
- assertVisible:
    id: e2e-ready-fixture-user-with-today-meal
- assertVisible:
    id: home-screen
- swipe:
    direction: UP
    duration: 600
- assertVisible:
    id: home-view-history-button
- tapOn:
    id: home-view-history-button
- extendedWaitUntil:
    visible:
      id: history-list-screen
    timeout: 10000
- assertVisible:
    id: history-meal-sync-pending-0
- takeScreenshot: mj039-history-pending-light
- tapOn:
    id: history-meal-row-0
- extendedWaitUntil:
    visible:
      id: history-meal-details-screen
    timeout: 10000
- assertVisible:
    id: history-meal-details-sync-pending
- takeScreenshot: mj039-details-pending-light
- openLink: "fitaly://e2e/reset?logout=0&theme=light"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=user-with-failed-meal&credits=ok"
- assertVisible:
    id: e2e-ready-fixture-user-with-failed-meal
- assertVisible:
    id: home-screen
- swipe:
    direction: UP
    duration: 600
- assertVisible:
    id: home-view-history-button
- tapOn:
    id: home-view-history-button
- extendedWaitUntil:
    visible:
      id: history-list-screen
    timeout: 10000
- assertVisible:
    id: history-meal-sync-failed-0
- takeScreenshot: mj039-history-failed-light
- tapOn:
    id: history-meal-row-0
- extendedWaitUntil:
    visible:
      id: history-meal-details-screen
    timeout: 10000
- assertVisible:
    id: history-meal-details-sync-failed
- takeScreenshot: mj039-details-failed-light
- openLink: "fitaly://e2e/reset?logout=0&theme=dark&offline=1"
- assertVisible:
    id: e2e-ready-offline
- openLink: "fitaly://e2e/seed?fixture=user-with-today-meal&credits=ok"
- assertVisible:
    id: e2e-ready-fixture-user-with-today-meal
- assertVisible:
    id: home-screen
- swipe:
    direction: UP
    duration: 600
- assertVisible:
    id: home-view-history-button
- tapOn:
    id: home-view-history-button
- extendedWaitUntil:
    visible:
      id: history-list-screen
    timeout: 10000
- assertVisible:
    id: history-meal-sync-pending-0
- takeScreenshot: mj039-history-pending-dark
- tapOn:
    id: history-meal-row-0
- extendedWaitUntil:
    visible:
      id: history-meal-details-screen
    timeout: 10000
- assertVisible:
    id: history-meal-details-sync-pending
- takeScreenshot: mj039-details-pending-dark
- openLink: "fitaly://e2e/reset?logout=0&theme=dark"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=user-with-failed-meal&credits=ok"
- assertVisible:
    id: e2e-ready-fixture-user-with-failed-meal
- assertVisible:
    id: home-screen
- swipe:
    direction: UP
    duration: 600
- assertVisible:
    id: home-view-history-button
- tapOn:
    id: home-view-history-button
- extendedWaitUntil:
    visible:
      id: history-list-screen
    timeout: 10000
- assertVisible:
    id: history-meal-sync-failed-0
- takeScreenshot: mj039-history-failed-dark
- tapOn:
    id: history-meal-row-0
- extendedWaitUntil:
    visible:
      id: history-meal-details-screen
    timeout: 10000
- assertVisible:
    id: history-meal-details-sync-failed
- takeScreenshot: mj039-details-failed-dark
- openLink: "fitaly://e2e/connectivity?offline=0"
- assertVisible:
    id: e2e-ready-home
