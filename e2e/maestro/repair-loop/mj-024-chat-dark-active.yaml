appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/reset?logout=0&theme=dark"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&credits=ok&billing=free&chat=success"
- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-chat-success
- tapOn:
    id: tab-chat
- assertVisible:
    id: chat-screen
- runFlow:
    when:
      visible:
        id: chat-legal-accept
    commands:
      - tapOn:
          id: chat-legal-accept
- tapOn: "Czy dziś trzymam plan?"
- assertVisible:
    id: chat-message-user
- extendedWaitUntil:
    visible:
      id: chat-message-ai
    timeout: 15000
- takeScreenshot: dark-chat-active
- tapOn:
    id: chat-input
- inputText: Czy możesz spokojnie podsumować mój dzisiejszy dzień pod kątem białka, kalorii i regularności posiłków? Napisz krótko, co wygląda dobrze, co warto poprawić przy kolacji i jaki jeden prosty krok zrobić teraz.
- assertVisible:
    id: chat-input
- assertVisible:
    id: chat-send-button
- takeScreenshot: dark-chat-long-input-keyboard
- tapOn:
    id: chat-send-button
- assertVisible:
    id: chat-message-user
- extendedWaitUntil:
    visible:
      id: chat-message-ai
    timeout: 15000
- tapOn:
    id: chat-keyboard-dismiss-zone
- assertVisible:
    id: chat-send-button
- takeScreenshot: dark-chat-after-send
