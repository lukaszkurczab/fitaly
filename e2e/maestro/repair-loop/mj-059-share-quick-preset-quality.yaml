appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/reset?logout=0&theme=light"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=user-with-photo-meal&shareExport=success"
- assertVisible:
    id: e2e-ready-fixture-user-with-photo-meal
- assertVisible:
    id: e2e-ready-shareExport-success
- scrollUntilVisible:
    element:
      id: home-today-meal-row-0
    direction: DOWN
- tapOn:
    id: home-today-meal-row-0
- assertVisible:
    id: history-meal-details-screen
- tapOn:
    id: history-meal-share-button
- assertVisible:
    id: share-screen
- takeScreenshot: mj059-share-quick-ready-light
- tapOn:
    id: share-preset-quickClassic
- takeScreenshot: mj059-share-quick-preset-1-light
- tapOn:
    id: share-preset-quickSidebar
- takeScreenshot: mj059-share-quick-preset-2-light
- tapOn:
    id: share-preset-quickFooter
- takeScreenshot: mj059-share-quick-preset-3-light
- tapOn:
    id: share-close-button
- openLink: "fitaly://e2e/reset?logout=0&theme=dark"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=user-with-photo-meal&shareExport=success"
- assertVisible:
    id: e2e-ready-fixture-user-with-photo-meal
- assertVisible:
    id: e2e-ready-shareExport-success
- scrollUntilVisible:
    element:
      id: home-today-meal-row-0
    direction: DOWN
- tapOn:
    id: home-today-meal-row-0
- assertVisible:
    id: history-meal-details-screen
- tapOn:
    id: history-meal-share-button
- assertVisible:
    id: share-screen
- takeScreenshot: mj059-share-quick-ready-dark
- tapOn:
    id: share-preset-quickFooter
- takeScreenshot: mj059-share-quick-selected-preset-dark
