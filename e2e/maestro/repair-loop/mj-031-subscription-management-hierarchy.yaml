appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml

- openLink: "fitaly://e2e/reset?logout=0&theme=light"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&credits=ok&billing=free"
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-billing-free
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element:
      id: account-manage-subscription-row
    direction: DOWN
- tapOn:
    id: account-manage-subscription-row
- assertVisible:
    id: manage-subscription-screen
- assertVisible:
    id: manage-subscription-status-value-free_active
- assertVisible:
    id: manage-subscription-credits-balance-row
- takeScreenshot: mj031-manage-free-light

- openLink: "fitaly://e2e/seed?credits=ok&billing=premium"
- assertVisible:
    id: e2e-ready-billing-premium
- assertVisible:
    id: manage-subscription-screen
- extendedWaitUntil:
    visible:
      id: manage-subscription-status-value-premium_active
    timeout: 15000
- assertVisible:
    id: manage-subscription-credits-allocation-value-800
- takeScreenshot: mj031-manage-premium-light

- openLink: "fitaly://e2e/reset?logout=0&theme=dark"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&credits=ok&billing=free"
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-billing-free
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element:
      id: account-manage-subscription-row
    direction: DOWN
- tapOn:
    id: account-manage-subscription-row
- assertVisible:
    id: manage-subscription-screen
- assertVisible:
    id: manage-subscription-status-value-free_active
- assertVisible:
    id: manage-subscription-credits-balance-row
- takeScreenshot: mj031-manage-free-dark

- openLink: "fitaly://e2e/seed?credits=ok&billing=premium"
- assertVisible:
    id: e2e-ready-billing-premium
- assertVisible:
    id: manage-subscription-screen
- extendedWaitUntil:
    visible:
      id: manage-subscription-status-value-premium_active
    timeout: 15000
- assertVisible:
    id: manage-subscription-credits-allocation-value-800
- takeScreenshot: mj031-manage-premium-dark
