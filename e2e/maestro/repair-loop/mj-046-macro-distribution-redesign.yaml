appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml

- openLink: "fitaly://e2e/reset?logout=0&theme=light"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=user-with-today-meal&credits=ok"
- assertVisible:
    id: e2e-ready-fixture-user-with-today-meal
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-statistics
- assertVisible:
    id: statistics-screen
- assertVisible:
    id: statistics-range-switcher
- extendedWaitUntil:
    visible:
      id: statistics-trend-card
    timeout: 10000
- takeScreenshot: mj046-statistics-overview-light
- scrollUntilVisible:
    element:
      id: statistics-macro-breakdown-card
    direction: DOWN
    centerElement: true
- takeScreenshot: mj046-statistics-macro-distribution-light

- openLink: "fitaly://e2e/reset?logout=0&theme=dark"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=user-with-today-meal&credits=ok"
- assertVisible:
    id: e2e-ready-fixture-user-with-today-meal
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-statistics
- assertVisible:
    id: statistics-screen
- assertVisible:
    id: statistics-range-switcher
- extendedWaitUntil:
    visible:
      id: statistics-trend-card
    timeout: 10000
- takeScreenshot: mj046-statistics-overview-dark
- scrollUntilVisible:
    element:
      id: statistics-macro-breakdown-card
    direction: DOWN
    centerElement: true
- takeScreenshot: mj046-statistics-macro-distribution-dark
