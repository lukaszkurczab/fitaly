appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/reset?logout=0&theme=light"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=user-with-photo-meal&shareExport=success"
- assertVisible:
    id: e2e-ready-fixture-user-with-photo-meal
- assertVisible:
    id: e2e-ready-shareExport-success
- scrollUntilVisible:
    element:
      id: home-today-meal-row-0
    direction: DOWN
- tapOn:
    id: home-today-meal-row-0
- assertVisible:
    id: history-meal-details-screen
- tapOn:
    id: history-meal-share-button
- assertVisible:
    id: share-screen
- tapOn:
    id: share-mode-customize-button
- assertVisible:
    id: share-utility-row
- takeScreenshot: mj058-share-customize-ready-light
- tapOn:
    id: share-close-button
- openLink: "fitaly://e2e/reset?logout=0&theme=dark"
- assertVisible:
    id: e2e-ready-home
- openLink: "fitaly://e2e/seed?fixture=user-with-photo-meal&shareExport=success"
- assertVisible:
    id: e2e-ready-fixture-user-with-photo-meal
- assertVisible:
    id: e2e-ready-shareExport-success
- scrollUntilVisible:
    element:
      id: home-today-meal-row-0
    direction: DOWN
- tapOn:
    id: home-today-meal-row-0
- assertVisible:
    id: history-meal-details-screen
- tapOn:
    id: history-meal-share-button
- assertVisible:
    id: share-screen
- tapOn:
    id: share-mode-customize-button
- assertVisible:
    id: share-utility-row
- takeScreenshot: mj058-share-customize-ready-dark
- tapOn:
    id: share-add-chart-button
- assertVisible:
    id: share-utility-row
- takeScreenshot: mj058-share-customize-tools-active-dark
- tapOn:
    id: share-add-text-button
- tapOn: "Dodaj notatkę"
- assertVisible:
    text: "Edycja tekstu"
- takeScreenshot: mj058-share-selected-layer-dark
