appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?credits=ok&chat=success&billing=free&aiConsent=granted"
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-chat-success
- assertVisible:
    id: e2e-ready-aiConsent-granted
- tapOn:
    id: tab-chat
- assertVisible:
    id: chat-screen
- tapOn:
    id: chat-input
- inputText: Plan a balanced dinner for today
- hideKeyboard
- assertVisible:
    id: chat-send-button
- tapOn:
    id: chat-send-button
- assertVisible:
    id: chat-message-user
- extendedWaitUntil:
    visible:
      id: chat-message-ai
    timeout: 15000
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-chat
- assertVisible:
    id: chat-screen
- assertVisible:
    id: chat-message-user
- assertVisible:
    id: chat-message-ai
