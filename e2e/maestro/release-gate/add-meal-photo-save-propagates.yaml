appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&credits=ok&ai=photoSlow&aiConsent=granted"
- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-ai-photoSlow
- assertVisible:
    id: e2e-ready-aiConsent-granted
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-photo
- tapOn:
    id: meal-add-option-photo
- assertVisible:
    id: add-meal-photo-screen
- assertVisible:
    id: add-meal-photo-e2e-preview
- tapOn:
    id: add-meal-photo-capture-button
- assertVisible:
    id: add-meal-photo-preparing-screen
- extendedWaitUntil:
    visible:
      id: review-meal-screen
    timeout: 15000
- tapOn:
    id: review-meal-ingredients-edit-button
- assertVisible:
    id: meal-details-form-screen
- tapOn:
    id: meal-name-input
- eraseText
- inputText: Release Photo Meal
- hideKeyboard
- scrollUntilVisible:
    element:
      id: meal-details-form-submit-button
    direction: DOWN
    centerElement: true
- tapOn:
    id: meal-details-form-submit-button
- assertVisible:
    id: review-meal-screen
- tapOn:
    id: review-meal-save-button
- assertVisible:
    id: home-screen
- assertVisible:
    id: home-today-meal-row-0
- scrollUntilVisible:
    element:
      id: home-view-history-button
    direction: DOWN
    centerElement: true
- assertVisible:
    id: home-view-history-button
- tapOn:
    id: home-view-history-button
- extendedWaitUntil:
    visible:
      id: history-list-screen
    timeout: 10000
- assertVisible:
    id: history-meal-row-0
- tapOn:
    id: history-meal-row-0
- assertVisible:
    id: history-meal-details-screen
- assertVisible:
    id: history-meal-details-title
- assertVisible:
    id: history-meal-details-kcal
