appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&credits=ok&ai=textSuccess"
- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-ai-textSuccess
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-text
- tapOn:
    id: meal-add-option-text
- assertVisible:
    id: add-meal-text-screen
- tapOn:
    id: add-meal-text-name-input
- eraseText
- inputText: E2E Stats Bowl
- tapOn:
    point: "50%,30%"
- waitForAnimationToEnd
- assertVisible:
    id: add-meal-text-analyze-button
- tapOn:
    id: add-meal-text-analyze-button
- extendedWaitUntil:
    visible:
      id: review-meal-screen
    timeout: 15000
- assertVisible:
    id: review-meal-save-button
- tapOn:
    id: review-meal-save-button
- assertVisible:
    id: home-screen
- extendedWaitUntil:
    visible:
      id: home-today-meal-row-0
    timeout: 10000
- assertVisible:
    id: home-hero-card
- assertVisible:
    id: home-hero-meta
- scrollUntilVisible:
    element:
      id: home-view-history-button
    direction: DOWN
- assertVisible:
    id: home-view-history-button
- tapOn:
    id: home-view-history-button
- extendedWaitUntil:
    visible:
      id: history-list-screen
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: history-meal-row-0
    timeout: 10000
- tapOn:
    id: tab-statistics
- assertVisible:
    id: statistics-screen
- assertVisible:
    id: statistics-range-switcher
- assertVisible:
    id: statistics-range-7d-button
- extendedWaitUntil:
    visible:
      id: statistics-trend-card
    timeout: 10000
- assertVisible:
    id: statistics-trend-metric-value
- scrollUntilVisible:
    element:
      id: statistics-daily-averages-section
    direction: DOWN
- assertVisible:
    id: statistics-average-kcal
- assertVisible:
    id: statistics-average-protein
