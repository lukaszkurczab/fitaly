appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&credits=none&billing=free"
- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- assertVisible:
    id: e2e-ready-credits-none
- assertVisible:
    id: e2e-ready-billing-free
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-text
- tapOn:
    id: meal-add-option-text
- assertVisible:
    id: add-meal-text-screen
- tapOn:
    id: add-meal-text-name-input
- eraseText
- inputText: Premium gated bowl
- tapOn:
    id: add-meal-text-description-input
- eraseText
- inputText: Rice chicken avocado and tahini
- hideKeyboard
- tapOn:
    id: add-meal-text-screen
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: add-meal-text-upgrade-button
    direction: DOWN
- assertVisible:
    id: add-meal-text-upgrade-button
- tapOn:
    id: add-meal-text-upgrade-button
- assertVisible:
    id: manage-subscription-screen
- tapOn:
    id: manage-subscription-primary-button
- assertVisible:
    id: paywall-modal
- takeScreenshot: premium-paywall-restore-modal
- openLink: "fitaly://e2e/seed?credits=ok&billing=restoreSuccess"
- assertVisible:
    id: paywall-modal
- scrollUntilVisible:
    element:
      id: paywall-restore-button
    direction: DOWN
- assertVisible:
    id: paywall-restore-button
- tapOn:
    id: paywall-restore-button
- extendedWaitUntil:
    visible:
      id: manage-subscription-status-value-premium_active
    timeout: 15000
- assertNotVisible:
    id: paywall-modal
- assertVisible:
    id: manage-subscription-screen
- assertVisible:
    id: manage-subscription-status-row
- scrollUntilVisible:
    element:
      id: manage-subscription-tier-row
    direction: DOWN
- assertVisible:
    id: manage-subscription-tier-row
- assertVisible:
    id: manage-subscription-tier-value-premium
- scrollUntilVisible:
    element:
      id: manage-subscription-credits-allocation-row
    direction: DOWN
- assertVisible:
    id: manage-subscription-credits-allocation-value-800
- takeScreenshot: premium-restore-success
