appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: fitaly://e2e/connectivity?offline=0
- extendedWaitUntil:
    notVisible:
      id: offline-banner
    timeout: 10000
- openLink: fitaly://e2e/seed?fixture=activated-user-empty
- extendedWaitUntil:
    visible:
      id: e2e-ready-fixture-activated-user-empty
    timeout: 10000
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-manual
- tapOn:
    id: meal-add-option-manual
- assertVisible:
    id: meal-details-form-screen
- tapOn:
    id: meal-name-input
- inputText: Local Warning Result Bowl
- hideKeyboard
- tapOn:
    id: meal-type-picker-trigger
- assertVisible:
    id: meal-type-picker-sheet
- tapOn:
    id: meal-type-picker-option-lunch
- tapOn:
    id: meal-type-picker-apply-button
- tapOn:
    id: meal-time-picker-trigger
- assertVisible:
    id: meal-time-picker-sheet
- tapOn:
    id: meal-time-picker-apply-button
- scrollUntilVisible:
    element:
      id: ingredient-add-button
    direction: DOWN
    centerElement: true
- tapOn:
    id: ingredient-add-button
- extendedWaitUntil:
    visible:
      id: ingredient-editor-sheet
    timeout: 10000
- tapOn:
    id: ingredient-editor-name-input
- inputText: Ostrzezenie
- extendedWaitUntil:
    visible:
      id: ingredient-autocomplete-warning
    timeout: 10000
- assertVisible:
    id: ingredient-autocomplete-results
- assertVisible:
    id: ingredient-autocomplete-row-0
- assertVisible: "Część danych katalogu może być niepełna."
- tapOn:
    id: ingredient-autocomplete-row-0
- assertVisible: Owies ostrzezenie
- tapOn:
    id: ingredient-editor-submit-button
- assertVisible:
    id: ingredient-row-0
- scrollUntilVisible:
    element:
      id: meal-details-form-submit-button
    direction: DOWN
    centerElement: true
- tapOn:
    id: meal-details-form-submit-button
- assertVisible:
    id: review-meal-screen
- assertVisible:
    id: review-meal-save-button
