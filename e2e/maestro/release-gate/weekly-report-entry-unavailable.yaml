appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?fixture=user-with-today-meal&billing=premium&weeklyReport=unavailable"
- assertVisible:
    id: e2e-ready-fixture-user-with-today-meal
- assertVisible:
    id: e2e-ready-weeklyReport-unavailable
- assertVisible:
    id: home-screen
- scrollUntilVisible:
    element:
      id: weekly-report-card
    direction: DOWN
- assertVisible:
    id: weekly-report-card
- takeScreenshot: weekly-report-card-unavailable
- tapOn:
    id: weekly-report-card
- assertVisible:
    id: home-screen
- assertVisible:
    id: weekly-report-card
- assertNotVisible:
    id: weekly-report-screen
- takeScreenshot: weekly-report-card-unavailable-after-retry
