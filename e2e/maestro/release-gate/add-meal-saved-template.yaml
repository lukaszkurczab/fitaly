appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: fitaly://e2e/seed?fixture=activated-user-empty
- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-manual
- tapOn:
    id: meal-add-option-manual
- assertVisible:
    id: meal-details-form-screen
- tapOn:
    id: meal-name-input
- eraseText
- inputText: Release Saved Template Bowl
- hideKeyboard
- scrollUntilVisible:
    element:
      id: meal-details-form-submit-button
    direction: DOWN
- tapOn:
    id: meal-details-form-submit-button
- assertVisible:
    id: review-meal-screen
- tapOn:
    id: review-meal-save-to-my-meals-checkbox
- tapOn:
    id: review-meal-save-button
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-saved
- tapOn:
    id: meal-add-option-saved
- assertVisible:
    id: select-saved-meal-screen
- assertVisible:
    id: saved-meal-add-e2e-draft-meal
- tapOn:
    id: saved-meal-add-e2e-draft-meal
- assertVisible:
    id: review-meal-screen
- tapOn:
    id: review-meal-save-button
- assertVisible:
    id: home-screen
- assertVisible:
    id: home-today-meal-row-0
- scrollUntilVisible:
    element:
      id: home-view-history-button
    direction: DOWN
- tapOn:
    id: home-view-history-button
- extendedWaitUntil:
    visible:
      id: history-list-screen
    timeout: 10000
- assertVisible:
    id: history-meal-row-0
