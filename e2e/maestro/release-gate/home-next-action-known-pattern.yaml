appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: fitaly://e2e/reset?logout=0
- assertVisible:
    id: e2e-ready-home
- openLink: fitaly://e2e/seed?fixture=activated-user-empty&planning=empty&knownPattern=candidate&credits=ok&billing=free
- extendedWaitUntil:
    visible:
      id: e2e-ready-fixture-activated-user-empty
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: e2e-ready-knownPattern-candidate
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: e2e-ready-planning-empty
    timeout: 30000
- tapOn:
    id: tab-profile
- assertVisible:
    id: account-screen
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- extendedWaitUntil:
    visible:
      id: home-next-action-prompt
    timeout: 15000
- assertVisible:
    id: home-next-action-title
- assertVisible:
    id: home-next-action-description
- tapOn:
    id: home-next-action-continue-button
- extendedWaitUntil:
    visible:
      id: meal-add-known-pattern-card
    timeout: 30000
- assertVisible:
    id: meal-add-known-pattern-review-button
- assertVisible:
    id: meal-add-known-pattern-dismiss-button
- assertNotVisible:
    id: review-meal-screen
- tapOn:
    id: meal-add-method-close-button
