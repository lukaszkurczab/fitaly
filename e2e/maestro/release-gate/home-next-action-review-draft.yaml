appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: fitaly://e2e/seed?fixture=user-with-draft
- assertVisible:
    id: e2e-ready-fixture-user-with-draft
- tapOn:
    id: tab-profile
- assertVisible:
    id: account-screen
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- extendedWaitUntil:
    visible:
      id: home-next-action-prompt
    timeout: 10000
- assertVisible:
    id: home-next-action-title
- assertVisible:
    id: home-next-action-description
- tapOn:
    id: home-next-action-dismiss-button
- assertNotVisible:
    id: home-next-action-prompt

- openLink: fitaly://e2e/reset?logout=0
- assertVisible:
    id: e2e-ready-home
- openLink: fitaly://e2e/seed?fixture=user-with-draft
- assertVisible:
    id: e2e-ready-fixture-user-with-draft
- tapOn:
    id: tab-profile
- assertVisible:
    id: account-screen
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- extendedWaitUntil:
    visible:
      id: home-next-action-prompt
    timeout: 10000
- tapOn:
    id: home-next-action-continue-button
- extendedWaitUntil:
    visible:
      id: review-meal-screen
    timeout: 10000
- assertVisible:
    id: review-meal-save-button
