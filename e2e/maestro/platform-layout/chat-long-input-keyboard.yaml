appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?credits=ok&chat=success&aiConsent=granted"
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-aiConsent-granted
- tapOn:
    id: tab-chat
- assertVisible:
    id: chat-screen
- tapOn:
    id: chat-input
- inputText: Czy możesz spokojnie podsumować mój dzisiejszy dzień pod kątem białka, kalorii i regularności posiłków? Napisz krótko, co wygląda dobrze, co warto poprawić przy kolacji i jaki jeden prosty krok zrobić teraz.
- assertVisible:
    id: chat-input
- assertVisible:
    id: chat-send-button
- tapOn:
    id: chat-keyboard-dismiss-zone
- assertVisible:
    id: chat-send-button
