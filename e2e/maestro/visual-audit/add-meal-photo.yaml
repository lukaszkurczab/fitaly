appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&credits=ok&ai=photoSlow"
- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-ai-photoSlow
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-photo
- takeScreenshot: add-meal-photo-options
- tapOn:
    id: meal-add-option-photo
- assertVisible:
    id: add-meal-photo-screen
- assertVisible:
    id: add-meal-photo-capture-button
- takeScreenshot: add-meal-photo-first-entry
- swipe:
    start: 50%, 64%
    end: 50%, 86%
    duration: 600
- assertVisible:
    id: add-meal-photo-fullscreen-change-method-button
- takeScreenshot: add-meal-photo-fullscreen
- tapOn:
    id: add-meal-photo-fullscreen-change-method-button
- assertVisible:
    id: meal-add-option-photo
- takeScreenshot: add-meal-photo-fullscreen-method-switch
- tapOn:
    id: meal-add-option-photo
- assertVisible:
    id: add-meal-photo-fullscreen-change-method-button
- takeScreenshot: add-meal-photo-return-to-fullscreen
- swipe:
    start: 50%, 72%
    end: 50%, 46%
    duration: 600
- assertVisible:
    id: add-meal-photo-capture-button
- takeScreenshot: add-meal-photo-fullscreen-off-after-swipe-up
- tapOn:
    id: add-meal-photo-capture-button
- assertVisible:
    id: add-meal-photo-preparing-screen
- takeScreenshot: add-meal-photo-preparing
- extendedWaitUntil:
    visible:
      id: review-meal-screen
    timeout: 15000
- takeScreenshot: add-meal-photo-review-meal
- tapOn:
    id: review-meal-save-button
- assertVisible:
    id: home-screen
- extendedWaitUntil:
    visible:
      id: home-today-meal-row-0
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: review-meal-screen
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: review-meal-close
    timeout: 10000
- takeScreenshot: add-meal-photo-home-after-save
