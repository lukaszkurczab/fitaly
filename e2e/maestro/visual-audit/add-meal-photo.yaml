appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&credits=ok&ai=photoSlow"
- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-ai-photoSlow
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-photo
- takeScreenshot: add-meal-photo-options
- tapOn:
    id: meal-add-option-photo
- assertVisible:
    id: add-meal-photo-screen
- assertVisible:
    id: add-meal-photo-e2e-preview
- takeScreenshot: add-meal-photo-entry
- tapOn:
    id: add-meal-photo-capture-button
- assertVisible:
    id: add-meal-photo-preparing-screen
- takeScreenshot: add-meal-photo-preparing
- extendedWaitUntil:
    visible:
      id: review-meal-screen
    timeout: 15000
- takeScreenshot: add-meal-photo-review-meal
- tapOn:
    id: review-meal-save-button
- assertVisible:
    id: home-screen
- extendedWaitUntil:
    visible:
      id: home-today-meal-row-0
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: review-meal-screen
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: review-meal-close
    timeout: 10000
- takeScreenshot: add-meal-photo-home-after-save
