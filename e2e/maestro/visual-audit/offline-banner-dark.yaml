appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- tapOn:
    id: tab-profile
- assertVisible:
    id: account-profile-details-row
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: UP
    duration: 600
- scrollUntilVisible:
    element:
      id: account-app-settings-row
    direction: DOWN
- tapOn:
    id: account-app-settings-row
- assertVisible:
    id: app-settings-screen
- tapOn:
    id: app-settings-dark-mode-toggle
- waitForAnimationToEnd
- tapOn:
    id: back-title-header-back
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- openLink: fitaly://e2e/connectivity?offline=1
- assertVisible:
    id: e2e-ready-offline
- assertVisible:
    id: offline-banner
- takeScreenshot: offline-banner-dark-visible
- swipe:
    from:
      id: offline-banner
    direction: LEFT
    duration: 450
- assertNotVisible:
    id: offline-banner
- takeScreenshot: offline-banner-dark-dismissed
- openLink: fitaly://e2e/connectivity?offline=0
- assertVisible:
    id: e2e-ready-home
