appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&credits=ok&ai=textSlow"
- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- assertVisible:
    id: home-screen
- takeScreenshot: home-empty
- tapOn:
    id: tab-statistics
- assertVisible:
    id: statistics-screen
- extendedWaitUntil:
    visible:
      id: statistics-empty-state-no_history
    timeout: 10000
- takeScreenshot: statistics-empty
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-text
- assertVisible:
    id: meal-add-option-manual
- takeScreenshot: add-meal-options
- tapOn:
    id: meal-add-option-text
- assertVisible:
    id: add-meal-text-screen
- takeScreenshot: add-meal-text-empty
- tapOn:
    id: add-meal-text-name-input
- eraseText
- inputText: Kurczak z ryżem
- assertVisible:
    id: add-meal-text-name-input
- takeScreenshot: add-meal-text-keyboard
- tapOn:
    point: "50%,30%"
- waitForAnimationToEnd
- takeScreenshot: add-meal-text-filled
- assertVisible:
    id: add-meal-text-analyze-button
- tapOn:
    id: add-meal-text-analyze-button
- takeScreenshot: add-meal-text-analyzing
- extendedWaitUntil:
    visible:
      id: review-meal-screen
    timeout: 15000
- takeScreenshot: review-meal
- tapOn:
    id: review-meal-save-button
- assertVisible:
    id: home-screen
- extendedWaitUntil:
    visible:
      id: home-today-meal-row-0
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: review-meal-screen
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: review-meal-close
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: home-after-save
- scrollUntilVisible:
    element:
      id: home-view-history-button
    direction: DOWN
- tapOn:
    id: home-view-history-button
- extendedWaitUntil:
    visible:
      id: history-list-screen
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: history-meal-row-0
    timeout: 10000
- takeScreenshot: history-after-save
- tapOn:
    id: history-filter-button
- assertVisible:
    id: history-filter-panel
- tapOn:
    id: history-filter-date-today
- tapOn:
    id: history-filter-calories-300-600
- takeScreenshot: history-filters-enabled
- tapOn:
    id: history-filter-show-results-button
- assertVisible:
    id: history-list-screen
- tapOn:
    id: tab-statistics
- assertVisible:
    id: statistics-screen
- assertVisible:
    id: statistics-range-switcher
- extendedWaitUntil:
    visible:
      id: statistics-trend-card
    timeout: 10000
- takeScreenshot: statistics-overview
- scrollUntilVisible:
    element:
      id: statistics-macro-breakdown-card
    direction: DOWN
- takeScreenshot: statistics-lower-sections
