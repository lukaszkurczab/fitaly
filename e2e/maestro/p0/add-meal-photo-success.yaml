appId: com.lkurczab.fitaly
---
- runFlow: ../login.yaml
- openLink: "fitaly://e2e/seed?fixture=activated-user-empty&credits=ok&ai=photoSuccess"
- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-ai-photoSuccess
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-photo
- tapOn:
    id: meal-add-option-photo
- assertVisible:
    id: add-meal-photo-screen
- assertVisible:
    id: add-meal-photo-e2e-preview
- tapOn:
    id: add-meal-photo-capture-button
- assertVisible:
    id: add-meal-photo-preparing-screen
- extendedWaitUntil:
    visible:
      id: review-meal-screen
    timeout: 15000
- tapOn:
    id: review-meal-save-button
- assertVisible:
    id: home-screen
- assertVisible:
    id: home-today-meal-row-0
- scrollUntilVisible:
    element:
      id: home-view-history-button
    direction: DOWN
- tapOn:
    id: home-view-history-button
- assertVisible:
    id: history-list-screen
- assertVisible:
    id: history-meal-row-0
