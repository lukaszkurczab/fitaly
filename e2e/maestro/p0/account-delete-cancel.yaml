appId: com.lkurczab.fitaly
env:
  E2E_PASSWORD: Test@1234
---
- runFlow: ../login.yaml
- tapOn:
    id: tab-profile
- assertVisible:
    id: account-screen
- scrollUntilVisible:
    element:
      id: account-delete-account-row
    direction: DOWN
- tapOn:
    id: account-delete-account-row
- assertVisible:
    id: delete-account-screen
- tapOn:
    id: delete-account-password-input
- eraseText
- inputText: ${E2E_PASSWORD}
- assertVisible:
    id: delete-account-cancel-button
- tapOn:
    id: delete-account-cancel-button
- assertVisible:
    id: account-screen
- assertVisible:
    id: tab-profile
