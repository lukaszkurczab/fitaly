appId: com.lkurczab.fitaly
---
- runFlow: ../login.yaml
- openLink: fitaly://e2e/seed?fixture=activated-user-empty
- assertVisible:
    id: e2e-ready-fixture-activated-user-empty
- openLink: fitaly://e2e/connectivity?offline=1
- assertVisible:
    id: e2e-ready-offline
- assertVisible:
    id: offline-banner
- tapOn:
    id: tab-add-meal
- assertVisible:
    id: meal-add-option-manual
- tapOn:
    id: meal-add-option-manual
- assertVisible:
    id: review-meal-screen
- tapOn:
    id: review-meal-save-button
- assertVisible:
    id: home-screen
- extendedWaitUntil:
    visible:
      id: home-today-meal-row-0
    timeout: 10000
- assertVisible:
    id: home-meal-sync-pending-0
- scrollUntilVisible:
    element:
      id: home-view-history-button
    direction: DOWN
- tapOn:
    id: home-view-history-button
- assertVisible:
    id: history-list-screen
- assertVisible:
    id: history-meal-row-0
- assertNotVisible:
    id: history-meal-row-1
- openLink: fitaly://e2e/connectivity?offline=0
- assertVisible:
    id: e2e-ready-home
- assertNotVisible:
    id: offline-banner
- extendedWaitUntil:
    visible:
      id: history-meal-sync-synced-0
    timeout: 30000
- assertVisible:
    id: history-meal-row-0
- assertNotVisible:
    id: history-meal-row-1
