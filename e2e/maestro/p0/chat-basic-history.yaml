appId: com.lkurczab.fitaly
---
- runFlow: ../login.yaml
- openLink: "fitaly://e2e/seed?credits=ok&chat=success&billing=free"
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-chat-success
- tapOn:
    id: tab-chat
- assertVisible:
    id: chat-screen
- runFlow:
    when:
      visible:
        id: chat-legal-accept
    commands:
      - tapOn:
          id: chat-legal-accept
- tapOn:
    id: chat-input
- inputText: Plan a balanced dinner for today
- hideKeyboard
- assertVisible:
    id: chat-send-button
- tapOn:
    id: chat-send-button
- assertVisible:
    id: chat-message-user
- extendedWaitUntil:
    visible:
      id: chat-message-ai
    timeout: 15000
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-chat
- assertVisible:
    id: chat-screen
- assertVisible:
    id: chat-message-user
- assertVisible:
    id: chat-message-ai
