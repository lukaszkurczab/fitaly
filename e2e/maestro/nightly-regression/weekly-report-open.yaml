appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?fixture=user-with-today-meal&billing=premium&weeklyReport=available"
- assertVisible:
    id: e2e-ready-fixture-user-with-today-meal
- assertVisible:
    id: e2e-ready-billing-premium
- assertVisible:
    id: e2e-ready-weeklyReport-available
- assertVisible:
    id: home-screen
- scrollUntilVisible:
    element:
      id: weekly-report-card
    direction: DOWN
- assertVisible:
    id: weekly-report-card
- takeScreenshot: weekly-report-card-ready
- tapOn:
    id: weekly-report-card
- assertVisible:
    id: weekly-report-screen
- extendedWaitUntil:
    visible:
      id: weekly-report-ready-state
    timeout: 15000
- assertVisible:
    id: weekly-report-summary-section
- assertVisible:
    id: weekly-report-signals-section
- takeScreenshot: weekly-report-ready-overview
- scrollUntilVisible:
    element:
      id: weekly-report-priorities-section
    direction: DOWN
- assertVisible:
    id: weekly-report-priorities-section
- takeScreenshot: weekly-report-priorities
