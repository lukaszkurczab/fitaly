appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?fixture=user-with-photo-meal&shareExport=success"
- assertVisible:
    id: e2e-ready-fixture-user-with-photo-meal
- scrollUntilVisible:
    element:
      id: home-view-history-button
    direction: DOWN
- tapOn:
    id: home-view-history-button
- extendedWaitUntil:
    visible:
      id: history-list-screen
    timeout: 10000
- tapOn:
    id: history-meal-row-0
- assertVisible:
    id: history-meal-details-screen
- tapOn:
    id: history-meal-share-button
- assertVisible:
    id: share-screen
- assertVisible:
    id: share-canvas
- assertVisible:
    id: share-mode-customize-button
- tapOn:
    id: share-mode-customize-button
- assertVisible:
    id: share-canvas
- assertVisible:
    id: share-utility-row
- assertVisible:
    id: share-add-text-button
- assertVisible:
    id: share-add-chart-button
- assertVisible:
    id: share-add-card-button
- assertVisible:
    id: share-reset-button
- tapOn:
    id: share-add-text-button
- assertVisible:
    id: share-canvas
- assertVisible:
    id: share-add-chart-button
- tapOn:
    id: share-add-chart-button
- assertVisible:
    id: share-canvas
- assertVisible:
    id: share-add-card-button
- tapOn:
    id: share-add-card-button
- assertVisible:
    id: share-canvas
- assertVisible:
    id: share-reset-button
- tapOn:
    id: share-reset-button
- assertVisible:
    id: share-canvas
- assertVisible:
    id: share-save-gallery-button
- assertVisible:
    id: share-system-share-button
- assertNotVisible:
    id: share-export-error
