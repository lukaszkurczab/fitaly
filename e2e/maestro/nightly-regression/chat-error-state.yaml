appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?credits=ok&chat=failure&billing=free"
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-chat-failure
- tapOn:
    id: tab-chat
- assertVisible:
    id: chat-screen
- runFlow:
    when:
      visible:
        id: chat-legal-accept
    commands:
      - tapOn:
          id: chat-legal-accept
- tapOn:
    id: chat-input
- inputText: Trigger deterministic chat failure
- tapOn:
    id: chat-send-button
- assertVisible:
    id: chat-message-user
- extendedWaitUntil:
    visible:
      id: chat-error-state
    timeout: 15000
- assertVisible:
    id: chat-retry-button
- assertNotVisible:
    id: chat-message-ai
