appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?credits=ok&billing=restoreError"
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-billing-restoreError
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element:
      id: account-manage-subscription-row
    direction: DOWN
- tapOn:
    id: account-manage-subscription-row
- assertVisible:
    id: manage-subscription-screen
- scrollUntilVisible:
    element:
      id: manage-subscription-restore-row
    direction: DOWN
- tapOn:
    id: manage-subscription-restore-row
- scrollUntilVisible:
    element:
      id: manage-subscription-action-feedback-restore-failed
    direction: UP
- extendedWaitUntil:
    visible:
      id: manage-subscription-action-feedback-restore-failed
    timeout: 15000
- assertVisible:
    id: manage-subscription-screen
- takeScreenshot: premium-restore-failure
