appId: com.lkurczab.fitaly
env:
  E2E_EMAIL: e2e@example.com
---
- stopApp
- openLink: __E2E_EXPO_URL__
- runFlow:
    when:
      visible: "Nie teraz|Not [Nn]ow"
    commands:
      - tapOn: "Nie teraz|Not [Nn]ow"
- assertVisible:
    id: e2e-booted
- openLink: fitaly://e2e/reset?logout=1
- assertVisible:
    id: e2e-ready-login
- assertVisible:
    id: login-screen
- tapOn:
    id: login-forgot-password-link
- assertVisible:
    id: reset-password-screen
- tapOn:
    id: reset-password-email-input
- eraseText
- inputText: ${E2E_EMAIL}
- hideKeyboard
- runFlow:
    when:
      visible:
        id: reset-password-submit-button
    commands:
      - tapOn:
          id: reset-password-submit-button
- extendedWaitUntil:
    visible:
      id: check-mailbox-screen
    timeout: 20000
- takeScreenshot: auth-reset-password-check-mailbox
- tapOn:
    id: check-mailbox-close-button
- assertVisible:
    id: reset-password-screen
- tapOn:
    id: reset-password-login-link
- assertVisible:
    id: login-screen
