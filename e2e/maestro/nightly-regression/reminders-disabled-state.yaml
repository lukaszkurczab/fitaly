appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: fitaly://e2e/seed?notificationPermission=allowed&reminder=disabled
- assertVisible:
    id: e2e-ready-reminder-disabled
- tapOn:
    id: tab-profile
- assertVisible:
    id: account-profile-details-row
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: UP
    duration: 600
- scrollUntilVisible:
    element:
      id: account-app-settings-row
    direction: DOWN
- tapOn:
    id: account-app-settings-row
- runFlow:
    when:
      visible:
        id: meal-add-option-text
    commands:
      - tapOn:
          point: "10%,25%"
      - waitForAnimationToEnd
      - tapOn:
          id: tab-profile
      - swipe:
          direction: UP
          duration: 600
      - swipe:
          direction: UP
          duration: 600
      - scrollUntilVisible:
          element:
            id: account-app-settings-row
          direction: DOWN
      - tapOn:
          id: account-app-settings-row
- assertVisible:
    id: app-settings-screen
- tapOn:
    id: app-settings-notifications-row
- assertVisible:
    id: notifications-screen
- assertVisible:
    id: notifications-permission-allowed-state
- scrollUntilVisible:
    element:
      id: notifications-smart-reminders-unavailable
    direction: DOWN
- assertVisible:
    id: notifications-smart-reminders-unavailable
- assertVisible:
    id: notifications-smart-reminders-state-off
- assertVisible:
    id: notifications-smart-reminders-toggle
- takeScreenshot: notifications-reminders-disabled
- assertNotVisible:
    id: legacy-reminders-screen
