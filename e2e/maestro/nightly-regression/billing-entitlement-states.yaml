appId: com.lkurczab.fitaly
---
- runFlow: ../smoke/login.yaml
- openLink: "fitaly://e2e/seed?credits=ok&billing=free"
- assertVisible:
    id: e2e-ready-credits-ok
- assertVisible:
    id: e2e-ready-billing-free
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element:
      id: account-manage-subscription-row
    direction: DOWN
- tapOn:
    id: account-manage-subscription-row
- assertVisible:
    id: manage-subscription-screen
- assertVisible:
    id: manage-subscription-status-row
- assertVisible:
    id: manage-subscription-status-value-free_active
- assertVisible:
    id: manage-subscription-tier-row
- assertVisible:
    id: manage-subscription-tier-value-free
- assertVisible:
    id: manage-subscription-credits-balance-row
- takeScreenshot: premium-manage-free
- openLink: "fitaly://e2e/seed?credits=ok&billing=premium"
- assertVisible:
    id: e2e-ready-billing-premium
- assertVisible:
    id: manage-subscription-screen
- assertVisible:
    id: manage-subscription-status-row
- extendedWaitUntil:
    visible:
      id: manage-subscription-status-value-premium_active
    timeout: 15000
- scrollUntilVisible:
    element:
      id: manage-subscription-tier-row
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: manage-subscription-tier-value-premium
    timeout: 15000
- assertVisible:
    id: manage-subscription-credits-allocation-row
- assertVisible:
    id: manage-subscription-credits-allocation-value-800
- takeScreenshot: premium-manage-premium
