name: CI

on:
  workflow_call:
    inputs:
      backend_contract_ref:
        description: Optional fitaly-backend ref for paired cross-repo contract PRs.
        required: false
        type: string
        default: ""
      require_exact_backend_contract_ref:
        description: Require backend_contract_ref to be an exact 40-character commit SHA.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      backend_contract_ref:
        description: Optional fitaly-backend ref for paired cross-repo contract PRs.
        required: false
        type: string
        default: ""
      require_exact_backend_contract_ref:
        description: Require backend_contract_ref to be an exact 40-character commit SHA.
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve backend contract ref
        id: backend-contract-ref
        run: ./scripts/resolve-backend-contract-ref.sh
        env:
          BACKEND_CONTRACT_REF_INPUT: ${{ inputs.backend_contract_ref }}
          BACKEND_CONTRACT_REF_REQUIRE_EXACT_SHA: ${{ inputs.require_exact_backend_contract_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Checkout backend repo (canonical Firebase rules source)
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/fitaly-backend
          path: _backend
          ref: ${{ steps.backend-contract-ref.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase config fixtures for CI
        run: |
          cat <<'JSON' > google-services.json
          {
            "client": [
              {
                "client_info": {
                  "android_client_info": {
                    "package_name": "com.lkurczab.fitaly"
                  }
                }
              }
            ]
          }
          JSON
          cat <<'PLIST' > GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>BUNDLE_ID</key>
            <string>com.lkurczab.fitaly</string>
          </dict>
          </plist>
          PLIST

      - name: Validate launch readiness config (android)
        run: npm run check:launch-readiness:android
        env:
          TERMS_URL: https://fitaly.app/terms
          PRIVACY_URL: https://fitaly.app/privacy
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RC_ANDROID_API_KEY: ${{ secrets.RC_ANDROID_API_KEY }}

      - name: Validate launch readiness config (ios)
        run: npm run check:launch-readiness:ios
        env:
          TERMS_URL: https://fitaly.app/terms
          PRIVACY_URL: https://fitaly.app/privacy
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RC_IOS_API_KEY: ${{ secrets.RC_IOS_API_KEY }}

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Security scan (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test
        env:
          BACKEND_REPO: _backend

  contract-sync:
    name: Cross-repo contract sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout mobile repo
        uses: actions/checkout@v5

      - name: Resolve backend contract ref
        id: backend-contract-ref
        run: ./scripts/resolve-backend-contract-ref.sh
        env:
          BACKEND_CONTRACT_REF_INPUT: ${{ inputs.backend_contract_ref }}
          BACKEND_CONTRACT_REF_REQUIRE_EXACT_SHA: ${{ inputs.require_exact_backend_contract_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Checkout backend repo (canonical contract source)
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/fitaly-backend
          path: _backend
          ref: ${{ steps.backend-contract-ref.outputs.ref }}

      - name: Verify contract sync
        run: BACKEND_REPO=_backend ./scripts/verify-backend-contract.sh
