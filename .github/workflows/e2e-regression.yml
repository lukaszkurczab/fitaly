name: E2E Regression

on:
  push:
    branches:
      - release/**
  workflow_dispatch:
    inputs:
      suite:
        description: "E2E suite to run"
        required: true
        default: release-gate
        type: choice
        options:
          - release-gate
          - nightly-regression
          - platform-layout
      platform:
        description: "Target platform for Maestro tests"
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  release-gate:
    name: Release Gate E2E
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'release-gate') }}
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      E2E_PLATFORM: ${{ inputs.platform || 'ios' }}
      E2E_RESULTS_PATH: /tmp/maestro-${{ inputs.platform || 'ios' }}-release-gate-results.xml
      E2E_EMAIL: ${{ secrets.SMOKE_EXPORT_TEST_EMAIL }}
      E2E_PASSWORD: ${{ secrets.SMOKE_EXPORT_TEST_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release gate E2E suite
        run: npm run e2e:release-gate

      - name: Upload release gate E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-release-gate-${{ env.E2E_PLATFORM }}
          path: |
            ${{ env.E2E_RESULTS_PATH }}
            /tmp/expo-e2e.log
            ~/.maestro/tests
          if-no-files-found: ignore

  nightly-regression:
    name: Nightly Regression E2E
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'nightly-regression') }}
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      E2E_PLATFORM: ${{ inputs.platform || 'ios' }}
      E2E_RESULTS_PATH: /tmp/maestro-${{ inputs.platform || 'ios' }}-nightly-regression-results.xml
      E2E_EMAIL: ${{ secrets.SMOKE_EXPORT_TEST_EMAIL }}
      E2E_PASSWORD: ${{ secrets.SMOKE_EXPORT_TEST_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run nightly regression E2E suite
        run: npm run e2e:nightly-regression

      - name: Upload nightly regression E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nightly-regression-${{ env.E2E_PLATFORM }}
          path: |
            ${{ env.E2E_RESULTS_PATH }}
            /tmp/expo-e2e.log
            ~/.maestro/tests
          if-no-files-found: ignore

  platform-layout:
    name: Platform Layout E2E
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'platform-layout' }}
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      E2E_PLATFORM: ${{ inputs.platform || 'ios' }}
      E2E_RESULTS_PATH: /tmp/maestro-${{ inputs.platform || 'ios' }}-platform-layout-results.xml
      E2E_EMAIL: ${{ secrets.SMOKE_EXPORT_TEST_EMAIL }}
      E2E_PASSWORD: ${{ secrets.SMOKE_EXPORT_TEST_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run platform layout E2E suite
        run: npm run e2e:platform-layout

      - name: Upload platform layout E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-platform-layout-${{ env.E2E_PLATFORM }}
          path: |
            ${{ env.E2E_RESULTS_PATH }}
            /tmp/expo-e2e.log
            ~/.maestro/tests
          if-no-files-found: ignore
