name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      backend_commit_sha:
        description: "Exact 40-character fitaly-backend commit SHA to certify with this mobile SHA"
        required: true
        type: string
      target_environment:
        description: "Target environment for release evidence"
        required: true
        default: production
        type: choice
        options:
          - production
      platform:
        description: "Target platform for release E2E"
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
      delete_evidence_url:
        description: "External URL for the completed disposable-account delete evidence"
        required: true
        default: ""
      delete_evidence_timestamp_utc:
        description: "UTC timestamp of the completed disposable-account delete run (ISO 8601, Z)"
        required: true
        default: ""
      delete_evidence_disposable_user_ref:
        description: "Pseudonymous disposable user reference: delete-run-<token>"
        required: true
        default: ""
      delete_evidence_backend_deletion:
        description: "Backend account-scoped deletion result (deleted)"
        required: true
        default: ""
      delete_evidence_firebase_auth_deletion:
        description: "Firebase Auth deletion result (deleted)"
        required: true
        default: ""
      delete_evidence_storage_cleanup:
        description: "Storage cleanup result (deleted)"
        required: true
        default: ""
      delete_evidence_reaccess_result:
        description: "Re-access result after deletion (denied)"
        required: true
        default: ""
      delete_evidence_owner:
        description: "Accountable execution owner (non-PII handle)"
        required: true
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  validate-release-pair:
    name: Validate exact release pair
    runs-on: ubuntu-latest
    outputs:
      mobile_sha: ${{ steps.release-pair.outputs.mobile_sha }}
      backend_sha: ${{ steps.release-pair.outputs.backend_sha }}
      target_environment: ${{ steps.release-pair.outputs.target_environment }}
    steps:
      - name: Validate exact backend SHA input
        id: release-pair
        env:
          MOBILE_SHA: ${{ github.sha }}
          BACKEND_SHA_INPUT: ${{ inputs.backend_commit_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          if [[ ! "${MOBILE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Mobile SHA is not an exact 40-character commit SHA: ${MOBILE_SHA}" >&2
            exit 1
          fi
          if [[ ! "${BACKEND_SHA_INPUT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "backend_commit_sha must be an exact 40-character commit SHA." >&2
            exit 1
          fi
          echo "mobile_sha=${MOBILE_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_sha=${BACKEND_SHA_INPUT}" >> "$GITHUB_OUTPUT"
          echo "target_environment=${TARGET_ENVIRONMENT}" >> "$GITHUB_OUTPUT"

  mobile-ci:
    name: Mobile CI
    needs:
      - validate-release-pair
    uses: ./.github/workflows/ci.yml
    with:
      backend_contract_ref: ${{ needs.validate-release-pair.outputs.backend_sha }}
      require_exact_backend_contract_ref: true
    secrets: inherit

  backend-ci:
    name: Backend CI
    needs:
      - validate-release-pair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout backend repository at exact SHA
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/fitaly-backend
          ref: ${{ needs.validate-release-pair.outputs.backend_sha }}
          path: backend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        working-directory: backend
        run: ruff check .

      - name: Run Pyright
        working-directory: backend
        run: pyright

      - name: Security scan (pip-audit)
        working-directory: backend
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80

  smoke-e2e:
    name: Smoke E2E
    needs:
      - validate-release-pair
    uses: ./.github/workflows/e2e-smoke-gate.yml
    with:
      platform: ${{ inputs.platform || 'ios' }}
    secrets: inherit

  release-gate-e2e:
    name: Release Gate E2E
    needs:
      - validate-release-pair
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      E2E_PLATFORM: ${{ inputs.platform || 'ios' }}
      E2E_ARTIFACT_DIR: core-release-gate-artifacts
      E2E_RESULTS_DIR: release-gate-reports
      E2E_RESULTS_PATH: release-gate-reports/results.xml
      E2E_SKIP_API_HEALTH: "0"
      E2E_API_BASE_URL: http://127.0.0.1:8000
      FIREBASE_PROJECT_ID: demo-fitaly-local
      FIRESTORE_DATABASE_ID: (default)
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      EXPO_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: http://127.0.0.1:9099
      E2E_EMAIL: e2e@example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout backend repository at exact SHA
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/fitaly-backend
          ref: ${{ needs.validate-release-pair.outputs.backend_sha }}
          path: backend

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci

      - name: Start Firebase emulators
        working-directory: backend
        run: |
          nohup npm run firebase:emulators -- --only auth,firestore > /tmp/fitaly-firebase-emulators.log 2>&1 &

      - name: Start backend API on port 8000
        working-directory: backend
        env:
          ENVIRONMENT: development
          FIREBASE_PROJECT_ID: demo-fitaly-local
          FIRESTORE_DATABASE_ID: (default)
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          EAGER_FIREBASE_INIT: "false"
          DISABLE_BILLING: "1"
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/fitaly-backend-api.log 2>&1 &

      - name: Wait for local backend health
        run: |
          for attempt in {1..30}; do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Local backend did not become healthy on port 8000." >&2
          echo "Backend log:" >&2
          tail -n 200 /tmp/fitaly-backend-api.log >&2 || true
          echo "Firebase emulator log:" >&2
          tail -n 200 /tmp/fitaly-firebase-emulators.log >&2 || true
          exit 1

      - name: Run core release gate E2E suite
        run: npm run e2e:core-release-gate

      - name: Upload core release gate JUnit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-core-release-gate-${{ env.E2E_PLATFORM }}
          path: release-gate-reports/*.xml
          if-no-files-found: error

      - name: Upload core release gate debug artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-core-release-gate-debug-${{ env.E2E_PLATFORM }}
          path: |
            core-release-gate-artifacts
            /tmp/fitaly-backend-api.log
            /tmp/fitaly-firebase-emulators.log
            /tmp/expo-e2e.log
            ~/.maestro/tests
          if-no-files-found: ignore

  smoke-export:
    name: Smoke export verification
    needs:
      - validate-release-pair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify smoke export endpoint
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          SMOKE_EXPORT_TEST_EMAIL: ${{ secrets.SMOKE_EXPORT_TEST_EMAIL }}
          SMOKE_EXPORT_TEST_PASSWORD: ${{ secrets.SMOKE_EXPORT_TEST_PASSWORD }}
          SMOKE_API_BASE_URL: https://fitaly-backend-smoke.up.railway.app
          EXPECTED_BACKEND_COMMIT_SHA: ${{ needs.validate-release-pair.outputs.backend_sha }}
        run: node scripts/verify-smoke-export.mjs artifacts/smoke-export-summary.json

      - name: Upload smoke export summary
        uses: actions/upload-artifact@v4
        with:
          name: smoke-export-summary
          path: artifacts/smoke-export-summary.json

  smoke-flow-contracts:
    name: Smoke flow contract verification
    needs:
      - validate-release-pair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify smoke premium/report flow contracts
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          SMOKE_EXPORT_TEST_EMAIL: ${{ secrets.SMOKE_EXPORT_TEST_EMAIL }}
          SMOKE_EXPORT_TEST_PASSWORD: ${{ secrets.SMOKE_EXPORT_TEST_PASSWORD }}
          SMOKE_API_BASE_URL: https://fitaly-backend-smoke.up.railway.app
          EXPECTED_BACKEND_COMMIT_SHA: ${{ needs.validate-release-pair.outputs.backend_sha }}
          MAX_FLOW_LATENCY_MS: "5000"
          WEEKLY_EXPECTED_STATUS: "403"
        run: node scripts/verify-smoke-flow-contracts.mjs artifacts/smoke-flow-summary.json

      - name: Upload smoke flow summary
        uses: actions/upload-artifact@v4
        with:
          name: smoke-flow-summary
          path: artifacts/smoke-flow-summary.json

  smoke-telemetry:
    name: Smoke telemetry verification
    needs:
      - validate-release-pair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify smoke telemetry ingest
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          SMOKE_EXPORT_TEST_EMAIL: ${{ secrets.SMOKE_EXPORT_TEST_EMAIL }}
          SMOKE_EXPORT_TEST_PASSWORD: ${{ secrets.SMOKE_EXPORT_TEST_PASSWORD }}
          SMOKE_API_BASE_URL: https://fitaly-backend-smoke.up.railway.app
          EXPECTED_BACKEND_COMMIT_SHA: ${{ needs.validate-release-pair.outputs.backend_sha }}
          SMOKE_TELEMETRY_TIMEOUT_MS: "10000"
        run: node scripts/verify-smoke-telemetry.mjs artifacts/smoke-telemetry-summary.json

      - name: Upload smoke telemetry summary
        uses: actions/upload-artifact@v4
        with:
          name: smoke-telemetry-summary
          path: artifacts/smoke-telemetry-summary.json

  ops-evidence:
    name: Fetch backup and restore evidence
    needs:
      - validate-release-pair
    runs-on: ubuntu-latest
    outputs:
      backup_run_url: ${{ steps.backup-run.outputs.url }}
      restore_run_url: ${{ steps.restore-run.outputs.url }}
    steps:
      - name: Find latest successful Firestore backup run
        id: backup-run
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: 'fitaly-backend',
              workflow_id: 'firestore-backup.yml',
              per_page: 20,
              status: 'completed',
            });
            const run = response.data.workflow_runs.find((candidate) => candidate.conclusion === 'success');
            if (!run) {
              core.setFailed('No successful Firestore backup run found on fitaly-backend.');
              return;
            }
            core.setOutput('url', run.html_url);
            core.setOutput('id', String(run.id));

      - name: Find latest successful Firestore restore drill run
        id: restore-run
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: 'fitaly-backend',
              workflow_id: 'firestore-restore-drill.yml',
              per_page: 20,
              status: 'completed',
            });
            const run = response.data.workflow_runs.find((candidate) => candidate.conclusion === 'success');
            if (!run) {
              core.setFailed('No successful Firestore restore drill run found on fitaly-backend.');
              return;
            }
            core.setOutput('url', run.html_url);
            core.setOutput('id', String(run.id));

  delete-evidence:
    name: Validate manual delete evidence
    needs:
      - validate-release-pair
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.validate.outputs.url }}
      timestamp_utc: ${{ steps.validate.outputs.timestamp_utc }}
      target_environment: ${{ steps.validate.outputs.target_environment }}
      mobile_sha: ${{ steps.validate.outputs.mobile_sha }}
      backend_sha: ${{ steps.validate.outputs.backend_sha }}
      disposable_user_ref: ${{ steps.validate.outputs.disposable_user_ref }}
      backend_deletion: ${{ steps.validate.outputs.backend_deletion }}
      firebase_auth_deletion: ${{ steps.validate.outputs.firebase_auth_deletion }}
      storage_cleanup: ${{ steps.validate.outputs.storage_cleanup }}
      reaccess_result: ${{ steps.validate.outputs.reaccess_result }}
      owner: ${{ steps.validate.outputs.owner }}
    steps:
      - name: Validate evidence input
        id: validate
        env:
          DELETE_EVIDENCE_URL: ${{ inputs.delete_evidence_url }}
          DELETE_EVIDENCE_TIMESTAMP_UTC: ${{ inputs.delete_evidence_timestamp_utc }}
          DELETE_EVIDENCE_DISPOSABLE_USER_REF: ${{ inputs.delete_evidence_disposable_user_ref }}
          DELETE_EVIDENCE_BACKEND_DELETION: ${{ inputs.delete_evidence_backend_deletion }}
          DELETE_EVIDENCE_FIREBASE_AUTH_DELETION: ${{ inputs.delete_evidence_firebase_auth_deletion }}
          DELETE_EVIDENCE_STORAGE_CLEANUP: ${{ inputs.delete_evidence_storage_cleanup }}
          DELETE_EVIDENCE_REACCESS_RESULT: ${{ inputs.delete_evidence_reaccess_result }}
          DELETE_EVIDENCE_OWNER: ${{ inputs.delete_evidence_owner }}
          TARGET_ENVIRONMENT: ${{ needs.validate-release-pair.outputs.target_environment }}
          MOBILE_SHA: ${{ needs.validate-release-pair.outputs.mobile_sha }}
          BACKEND_SHA: ${{ needs.validate-release-pair.outputs.backend_sha }}
        run: |
          fail() {
            echo "$1" >&2
            exit 1
          }

          reject_placeholder() {
            local name="$1"
            local raw="$2"
            local normalized
            normalized="$(printf '%s' "${raw}" | tr '[:upper:]' '[:lower:]')"
            [[ -n "${raw}" ]] || fail "${name} is required."
            [[ "${normalized}" =~ (pending|unknown|placeholder|not[[:space:]]provided|skipped) ]] && \
              fail "${name} must contain completed evidence, not a placeholder."
          }

          reject_placeholder "DELETE_EVIDENCE_URL" "${DELETE_EVIDENCE_URL}"
          reject_placeholder "DELETE_EVIDENCE_TIMESTAMP_UTC" "${DELETE_EVIDENCE_TIMESTAMP_UTC}"
          reject_placeholder "DELETE_EVIDENCE_DISPOSABLE_USER_REF" "${DELETE_EVIDENCE_DISPOSABLE_USER_REF}"
          reject_placeholder "DELETE_EVIDENCE_BACKEND_DELETION" "${DELETE_EVIDENCE_BACKEND_DELETION}"
          reject_placeholder "DELETE_EVIDENCE_FIREBASE_AUTH_DELETION" "${DELETE_EVIDENCE_FIREBASE_AUTH_DELETION}"
          reject_placeholder "DELETE_EVIDENCE_STORAGE_CLEANUP" "${DELETE_EVIDENCE_STORAGE_CLEANUP}"
          reject_placeholder "DELETE_EVIDENCE_REACCESS_RESULT" "${DELETE_EVIDENCE_REACCESS_RESULT}"
          reject_placeholder "DELETE_EVIDENCE_OWNER" "${DELETE_EVIDENCE_OWNER}"

          [[ "${TARGET_ENVIRONMENT}" == "production" ]] || fail "Delete evidence target environment must be production."
          [[ "${MOBILE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || fail "Delete evidence mobile SHA must be an exact 40-character commit SHA."
          [[ "${BACKEND_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || fail "Delete evidence backend SHA must be an exact 40-character commit SHA."
          [[ "${DELETE_EVIDENCE_TIMESTAMP_UTC}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{3})?Z$ ]] || \
            fail "DELETE_EVIDENCE_TIMESTAMP_UTC must be an ISO 8601 UTC timestamp."
          [[ "${DELETE_EVIDENCE_DISPOSABLE_USER_REF}" =~ ^delete-run-[a-z0-9][a-z0-9-]{1,62}$ ]] || \
            fail "DELETE_EVIDENCE_DISPOSABLE_USER_REF must be a pseudonymous delete-run token."
          [[ "${DELETE_EVIDENCE_BACKEND_DELETION}" == "deleted" ]] || fail "DELETE_EVIDENCE_BACKEND_DELETION must be deleted."
          [[ "${DELETE_EVIDENCE_FIREBASE_AUTH_DELETION}" == "deleted" ]] || fail "DELETE_EVIDENCE_FIREBASE_AUTH_DELETION must be deleted."
          [[ "${DELETE_EVIDENCE_STORAGE_CLEANUP}" == "deleted" ]] || fail "DELETE_EVIDENCE_STORAGE_CLEANUP must be deleted."
          [[ "${DELETE_EVIDENCE_REACCESS_RESULT}" == "denied" ]] || fail "DELETE_EVIDENCE_REACCESS_RESULT must be denied."
          [[ "${DELETE_EVIDENCE_OWNER}" =~ ^[a-z][a-z0-9_-]{1,63}$ ]] || fail "DELETE_EVIDENCE_OWNER must be a non-PII owner handle."
          [[ "${DELETE_EVIDENCE_URL}" =~ ^https:// ]] || fail "DELETE_EVIDENCE_URL must be an external HTTPS URL."
          [[ ! "${DELETE_EVIDENCE_URL}" =~ (localhost|127\.0\.0\.1|0\.0\.0\.0|file:|/tmp/|/Users/) ]] || \
            fail "DELETE_EVIDENCE_URL must not be a local path or host."
          [[ ! "${DELETE_EVIDENCE_URL}" =~ (@|uid=|user_id=) ]] || fail "DELETE_EVIDENCE_URL must not contain PII-like data."

          echo "url=${DELETE_EVIDENCE_URL}" >> "$GITHUB_OUTPUT"
          echo "timestamp_utc=${DELETE_EVIDENCE_TIMESTAMP_UTC}" >> "$GITHUB_OUTPUT"
          echo "target_environment=${TARGET_ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "mobile_sha=${MOBILE_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_sha=${BACKEND_SHA}" >> "$GITHUB_OUTPUT"
          echo "disposable_user_ref=${DELETE_EVIDENCE_DISPOSABLE_USER_REF}" >> "$GITHUB_OUTPUT"
          echo "backend_deletion=${DELETE_EVIDENCE_BACKEND_DELETION}" >> "$GITHUB_OUTPUT"
          echo "firebase_auth_deletion=${DELETE_EVIDENCE_FIREBASE_AUTH_DELETION}" >> "$GITHUB_OUTPUT"
          echo "storage_cleanup=${DELETE_EVIDENCE_STORAGE_CLEANUP}" >> "$GITHUB_OUTPUT"
          echo "reaccess_result=${DELETE_EVIDENCE_REACCESS_RESULT}" >> "$GITHUB_OUTPUT"
          echo "owner=${DELETE_EVIDENCE_OWNER}" >> "$GITHUB_OUTPUT"

  release-evidence:
    name: Build release evidence artifact
    runs-on: ubuntu-latest
    needs:
      - validate-release-pair
      - mobile-ci
      - backend-ci
      - smoke-e2e
      - release-gate-e2e
      - smoke-export
      - smoke-flow-contracts
      - smoke-telemetry
      - ops-evidence
      - delete-evidence
    outputs:
      artifact_name: release-evidence
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download smoke export summary
        uses: actions/download-artifact@v4
        with:
          name: smoke-export-summary
          path: artifacts

      - name: Download smoke flow summary
        uses: actions/download-artifact@v4
        with:
          name: smoke-flow-summary
          path: artifacts

      - name: Download smoke telemetry summary
        uses: actions/download-artifact@v4
        with:
          name: smoke-telemetry-summary
          path: artifacts

      - name: Download core release gate E2E reports
        uses: actions/download-artifact@v4
        with:
          name: e2e-core-release-gate-${{ inputs.platform || 'ios' }}
          path: release-gate-reports

      - name: Render release evidence markdown
        env:
          EXPORT_SUMMARY_PATH: artifacts/smoke-export-summary.json
          FLOW_SUMMARY_PATH: artifacts/smoke-flow-summary.json
          EVIDENCE_GENERATED_AT: ${{ github.run_id }} / ${{ github.run_attempt }} / ${{ github.event_name }}
          MOBILE_SHA: ${{ needs.validate-release-pair.outputs.mobile_sha }}
          BACKEND_SHA: ${{ needs.validate-release-pair.outputs.backend_sha }}
          TARGET_ENVIRONMENT: ${{ needs.validate-release-pair.outputs.target_environment }}
          MOBILE_CI_STATUS: verified mobile-ci job in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} attempt ${{ github.run_attempt }}
          BACKEND_CI_STATUS: verified backend-ci job in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} attempt ${{ github.run_attempt }}
          E2E_PLATFORM: verified ${{ inputs.platform || 'ios' }} self-hosted release runner in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} attempt ${{ github.run_attempt }}
          SMOKE_E2E_STATUS: verified smoke-e2e job in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} attempt ${{ github.run_attempt }}
          RELEASE_GATE_RESULTS_DIR: release-gate-reports
          RELEASE_GATE_EXPECTED_FLOW_COUNT: "20"
          RELEASE_GATE_EXPECTED_SUITE_KEY: core-release-gate
          RELEASE_GATE_SUITE_NAME: core-release-gate
          E2E_RESULTS_ARTIFACT_PATH: GitHub Actions artifact e2e-core-release-gate-${{ inputs.platform || 'ios' }} in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          E2E_SKIPPED_SUITES: Full 1.1 release-gate, nightly regression, and platform layout suites were not required for this core RC run.
          SMOKE_EXPORT_STATUS: verified smoke-export job in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} attempt ${{ github.run_attempt }}
          SMOKE_FLOW_CONTRACT_STATUS: verified smoke-flow-contracts job in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} attempt ${{ github.run_attempt }}
          TARGET_SDK_STATUS: verified via launch-readiness gate in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AAB_STATUS: verified via launch-readiness gate in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKUP_RUN_URL: ${{ needs.ops-evidence.outputs.backup_run_url }}
          RESTORE_RUN_URL: ${{ needs.ops-evidence.outputs.restore_run_url }}
          DELETE_EVIDENCE_URL: ${{ needs.delete-evidence.outputs.url }}
          DELETE_EVIDENCE_TIMESTAMP_UTC: ${{ needs.delete-evidence.outputs.timestamp_utc }}
          DELETE_EVIDENCE_TARGET_ENVIRONMENT: ${{ needs.delete-evidence.outputs.target_environment }}
          DELETE_EVIDENCE_MOBILE_SHA: ${{ needs.delete-evidence.outputs.mobile_sha }}
          DELETE_EVIDENCE_BACKEND_SHA: ${{ needs.delete-evidence.outputs.backend_sha }}
          DELETE_EVIDENCE_DISPOSABLE_USER_REF: ${{ needs.delete-evidence.outputs.disposable_user_ref }}
          DELETE_EVIDENCE_BACKEND_DELETION: ${{ needs.delete-evidence.outputs.backend_deletion }}
          DELETE_EVIDENCE_FIREBASE_AUTH_DELETION: ${{ needs.delete-evidence.outputs.firebase_auth_deletion }}
          DELETE_EVIDENCE_STORAGE_CLEANUP: ${{ needs.delete-evidence.outputs.storage_cleanup }}
          DELETE_EVIDENCE_REACCESS_RESULT: ${{ needs.delete-evidence.outputs.reaccess_result }}
          DELETE_EVIDENCE_OWNER: ${{ needs.delete-evidence.outputs.owner }}
          CHAT_INTEGRITY_TEST_STATUS: verified via mobile CI in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ONBOARDING_ATOMIC_CONTRACT_STATUS: verified via backend CI in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEEKLY_REPORT_PREMIUM_GATE_STATUS: verified via backend CI in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/render-release-evidence.mjs artifacts/release-evidence.md

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: artifacts/release-evidence.md

  production-readiness-gate:
    name: Production readiness approval
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs:
      - release-evidence
    environment:
      name: production
    steps:
      - name: Confirm release candidate package
        run: |
          echo "Release evidence artifact: release-evidence"
          echo "Environment approval is now required before public rollout."

  notify-on-failure:
    name: Notify Discord on failure
    if: ${{ failure() }}
    needs:
      - validate-release-pair
      - mobile-ci
      - backend-ci
      - smoke-e2e
      - release-gate-e2e
      - smoke-export
      - smoke-flow-contracts
      - smoke-telemetry
      - ops-evidence
      - delete-evidence
      - release-evidence
      - production-readiness-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Notify Discord
        env:
          OPS_ALERT_DISCORD_WEBHOOK_URL: ${{ secrets.OPS_ALERT_DISCORD_WEBHOOK_URL }}
          WORKFLOW_ENVIRONMENT: production
          WORKFLOW_NAME: Release Candidate
          WORKFLOW_OWNER: engineering-lead
          WORKFLOW_STATUS: failure
        run: bash scripts/notify-ops-discord.sh
